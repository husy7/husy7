# 每日生成贪吃蛇贡献图动画
# 使用 Platane/snk@v3 GitHub Action，从 husy7 的贡献图生成贪吃蛇 SVG，
# 并推送到 output 分支，供个人主页 README 引用。
# 参考文档：https://github.com/Platane/snk
name: Generate GitHub Contribution Snake

on:
  schedule:
    # 每天 UTC 0 点（北京时间 8 点）自动运行
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub contribution snake
        uses: Platane/snk@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?speed_factor=5
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&speed_factor=5

      # 修复 snk 以 root 写入文件的权限问题
      - name: Fix permissions
        run: sudo chown -R $(whoami) dist/ && chmod -R u+rw dist/

      # 推送到 output 分支
      - name: Push to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/snake-out
          cp dist/github-contribution-grid-snake.svg /tmp/snake-out/
          cp dist/github-contribution-grid-snake-dark.svg /tmp/snake-out/

          git fetch origin output 2>/dev/null \
            && git checkout output \
            || git checkout --orphan output

          git rm -rf . --quiet 2>/dev/null || true

          cp /tmp/snake-out/github-contribution-grid-snake.svg .
          cp /tmp/snake-out/github-contribution-grid-snake-dark.svg .

          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg

          git diff --cached --quiet \
            && echo "No changes to commit" \
            || git commit -m "chore: update contribution snake"

          git push origin output --force

      - name: Create workflow summary
        run: |
          echo "✅ Snake generated" >> $GITHUB_STEP_SUMMARY
          echo " - Light: github-contribution-grid-snake.svg" >> $GITHUB_STEP_SUMMARY
          echo " - Dark: github-contribution-grid-snake-dark.svg" >> $GITHUB_STEP_SUMMARY
          echo " - Branch: output" >> $GITHUB_STEP_SUMMARY
